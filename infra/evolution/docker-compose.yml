# Evolution API para o WhatsApp do Fedha Live (WHATSAPP_PROVIDER=evolution).
# Mesma imagem e configuração do UOR Connect. Arranque: docker compose up -d (com o .env ao lado; ver README.md).
services:
  evolution-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD no .env}
    volumes:
      - evolution_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 10

  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - evolution_redis:/data

  evolution-api:
    image: ${EVOLUTION_IMAGE:-evoapicloud/evolution-api:v2.3.6}
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8081}
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY:?define AUTHENTICATION_API_KEY no .env}
      DEL_INSTANCE: "false"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@evolution-postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: fedha_evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/1
      CACHE_REDIS_PREFIX_KEY: fedha_evolution
      CACHE_LOCAL_ENABLED: "false"
      RABBITMQ_ENABLED: "false"
      LOG_LEVEL: ${EVOLUTION_LOG_LEVEL:-ERROR}
    ports:
      # Só na máquina local; em servidor, põe atrás de um proxy com HTTPS ou na mesma rede da API.
      - "127.0.0.1:${EVOLUTION_PORT:-8081}:8080"
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  evolution_pg:
  evolution_redis:
  evolution_instances:
